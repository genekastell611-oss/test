name: Build StridePath APK

on:
  workflow_dispatch:
  push:
    paths:
      - "StridePath/**"
      - ".github/workflows/build-stridepath-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build StridePath
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract StridePath source
        run: |
          mkdir -p build-src
          unzip -q StridePath/StridePath-RPG-4.0.1-US-Android-Source.zip -d build-src

      - name: Run unit tests
        run: gradle -p build-src/StridePath testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p build-src/StridePath assembleDebug --stacktrace

      - name: Upload StridePath APK
        uses: actions/upload-artifact@v4
        with:
          name: StridePath-RPG-4.0.1-US-APK
          path: build-src/StridePath/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
