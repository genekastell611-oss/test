plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tripfuel.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tripfuel.app'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '7.0'
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
}
